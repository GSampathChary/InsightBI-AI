version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: insightbi_postgres
    restart: always
    environment:
      POSTGRES_USER: insight_user
      POSTGRES_PASSWORD: SecureInsightPassword123!
      POSTGRES_DB: insightbi_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight_user -d insightbi_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: insightbi_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: insightbi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=insight_user
      - POSTGRES_PASSWORD=SecureInsightPassword123!
      - POSTGRES_DB=insightbi_dw
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=c8f921a94e82b704e6b12a83c760e941a5b8214e6d7a9b01c3e4f5a6b7c8d9e0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: insightbi_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: insightbi_network
